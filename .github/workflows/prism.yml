name: PRISM

on:
  push:
    paths: ["prism/**", "plateforme/src/lib/**", ".github/workflows/prism.yml"]
  pull_request:
    paths: ["prism/**", "plateforme/src/lib/**"]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prism
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prism/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
